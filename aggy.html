
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aggy</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", Arial, sans-serif;
      font-size: 15px;
      color: #494e52;
      background: white;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      width: 91.6%;
      max-width: 1250px;
      margin: 0 auto;
    }

    .masthead {
      height: 69px;
      border-bottom: 1px solid #f2f3f3;
    }

    .masthead-inner {
      height: 100%;
      display: flex;
      align-items: center;
    }

    .site-name {
      margin-right: 60px;
      color: #7a8288;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }

    nav {
      display: flex;
      gap: 30px;
    }

    .nav-link {
      position: relative;
      padding: 8px 0;
      color: #7a8288;
      text-decoration: none;
      white-space: nowrap;
    }

    .nav-link::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 3px;
      width: 100%;
      height: 2px;
      background: #E8A9C5;
      transform: scaleX(0);
      transition: transform 0.2s ease;
    }

    .nav-link:hover::after {
      transform: scaleX(1);
    }

    .content {
      flex: 1;
      display: grid;
      grid-template-columns: 191px minmax(0, 773px);
      column-gap: 73px;
      padding-top: 30px;
      padding-bottom: 70px;
    }

    main {
      grid-column: 2;
    }

    .aggy-photo {
      display: block;
      width: 100%;
      max-width: 390px;
      height: auto;
      border-radius: 12px;
    }

    .site-footer {
      border-top: none;
      padding: 30px 0;
      color: #9ba1a6;
      font-size: 11px;
    }

    @media (max-width: 800px) {
      .content {
        display: block;
      }

      .site-name {
        margin-right: 25px;
      }

      nav {
        gap: 15px;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <header class="masthead">
      <div class="container masthead-inner">

        <a class="site-name" href="/">
          Zaky Elmoge
        </a>

        <nav aria-label="Main navigation">
          <a class="nav-link" href="/">About Me</a>
          <a class="nav-link" href="/projects.html">Projects</a>
          <a class="nav-link" href="/aggy.html">Aggy</a>
        </nav>

      </div>
    </header>

    <div class="container content">
      <main>
        <img
          class="aggy-photo"
          src="about-photo.jpg.jpg"
          alt="Aggy"
        >
      </main>
    </div>

    <footer class="site-footer">
      <div class="container">
        &copy; 2026 Zaky Elmoge.
      </div>
    </footer>

  </div>
</body>
</html>
