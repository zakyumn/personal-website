
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Projects by Zaky Elmoge">
  <title>Projects | Zaky Elmoge</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      color: #494e52;
      background: #fff;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      width: 91.6%;
      max-width: 1250px;
      margin: 0 auto;
    }

    /* Navigation */

    .masthead {
      height: 69px;
      border-bottom: 1px solid #f2f3f3;
    }

    .masthead-inner {
      height: 100%;
      display: flex;
      align-items: center;
    }

    .site-name {
      margin-right: 60px;
      color: #7a8288;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }

    .site-name:hover {
      color: #494e52;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 30px;
    }

    .nav-link {
      position: relative;
      display: inline-block;
      padding: 8px 0;
      color: #7a8288;
      font-size: 15px;
      text-decoration: none;
      white-space: nowrap;
    }

    .nav-link::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 3px;
      width: 100%;
      height: 2px;
      background: #494e52;
      transform: scaleX(0);
      transform-origin: center;
      transition: transform 0.2s ease;
    }

    .nav-link:hover::after,
    .nav-link:focus-visible::after {
      transform: scaleX(1);
    }

    /* Layout */

    .content {
      flex: 1;
      display: grid;
      grid-template-columns: 191px minmax(0, 773px);
      column-gap: 73px;
      align-items: start;
      padding-top: 30px;
      padding-bottom: 70px;
    }

    /* Sidebar */

    .sidebar {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .sidebar a {
      display: flex;
      align-items: center;
      gap: 5px;
      min-height: 23px;
      margin-bottom: 5px;
      padding: 2px 0;
      color: #494e52;
      font-size: 12px;
      text-decoration: none;
    }

    .sidebar a:hover {
      text-decoration: underline;
    }

    .icon {
      width: 13px;
      height: 13px;
      flex: 0 0 13px;
    }

    .linkedin-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 11px;
      height: 11px;
      flex: 0 0 11px;
      background: #0077b5;
      color: white;
      font-size: 8px;
      line-height: 1;
      font-weight: 700;
      border-radius: 1px;
    }

    /* Projects */

    main {
      max-width: 773px;
    }

    h1 {
      margin: 0 0 13px;
      font-size: 23.5px;
      font-weight: 700;
      line-height: 1;
    }

    main p {
      margin: 0 0 20px;
      font-size: 15px;
      line-height: 1.5;
    }

    main a {
      color: #7a8288;
      text-decoration: underline;
    }

    /* Footer */

    .site-footer {
      border-top: 1px solid #bdc1c4;
      padding: 30px 0;
      color: #9ba1a6;
      font-size: 11px;
    }

    /* Mobile */

    @media (max-width: 800px) {
      .content {
        grid-template-columns: 1fr;
        gap: 30px;
        padding-top: 25px;
      }

      .sidebar {
        flex-direction: row;
        flex-wrap: wrap;
        gap: 12px;
      }

      .sidebar a {
        margin: 0;
      }

      .site-name {
        margin-right: 35px;
      }

      nav {
        gap: 18px;
      }

      main {
        max-width: 100%;
      }
    }

    @media (max-width: 400px) {
      .site-name {
        margin-right: 20px;
      }

      nav {
        gap: 12px;
      }

      .nav-link {
        font-size: 13px;
      }
    }
    /* Light pink hover effects */

.site-name:hover,
.nav-link:hover,
.nav-link:focus-visible {
  color: #E8A9C5;
}

.nav-link::after {
  background-color: #E8A9C5;
}
  </style>
</head>

<body>
  <div class="page">

    <header class="masthead">
      <div class="container masthead-inner">

        <a class="site-name" href="/">
          Zaky Elmoge
        </a>

        <nav aria-label="Main navigation">
          <a class="nav-link" href="/">About Me</a>
          <a class="nav-link" href="/projects.html">Projects</a>
        </nav>

      </div>
    </header>

    <div class="container content">
</div>

    <footer class="site-footer">
      <div class="container">
        &copy; 2026 Zaky Elmoge.
      </div>
    </footer>

  </div>
</body>
</html>
